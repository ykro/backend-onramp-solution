<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="http-title http-desc">
  <title id="http-title">Paso 1: Contratos HTTP/1.1 y estado aislado</title>
  <desc id="http-desc">Recorrido de peticiones POST, GET y DELETE desde el cliente hacia FastAPI con estado local por instancia y respuestas 201 Created, 204 No Content y 404 Not Found.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="920" height="310" rx="12" fill="#F8F7F4"/>
  <text x="32" y="38" fill="#0F172A" font-size="16" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Paso 1 — Contratos HTTP/1.1 y estado aislado por instancia</text>

  <!-- Cliente -->
  <rect x="32" y="88" width="170" height="140" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="117" y="120" fill="#0F172A" font-size="14" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Cliente HTTP</text>
  <text x="117" y="148" fill="#475569" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">POST /books</text>
  <text x="117" y="172" fill="#475569" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GET /books/{id}</text>
  <text x="117" y="196" fill="#475569" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">DELETE /books/{id}</text>

  <line x1="206" y1="158" x2="270" y2="158" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="238" y="146" fill="#2563EB" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">HTTP/1.1</text>

  <!-- FastAPI + Estado aislado -->
  <rect x="276" y="72" width="268" height="172" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="410" y="100" fill="#1D4ED8" font-size="13" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">create_app() — Instancia A</text>
  <rect x="294" y="116" width="232" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="410" y="138" fill="#0F172A" font-size="11.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">books = {} · next_id = 1</text>
  <text x="410" y="156" fill="#64748B" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Variables locales, nunca globales</text>
  <rect x="294" y="176" width="232" height="50" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="410" y="198" fill="#1E40AF" font-size="11.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">create_app() — Instancia B</text>
  <text x="410" y="216" fill="#1D4ED8" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Catálogo propio e independiente</text>

  <!-- Flechas hacia respuestas -->
  <line x1="548" y1="108" x2="622" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="548" y1="158" x2="622" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="548" y1="208" x2="622" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- Respuestas -->
  <rect x="628" y="72" width="260" height="48" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <text x="644" y="93" fill="#065F46" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">201 Created</text>
  <text x="644" y="110" fill="#047857" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">POST /books devuelve BookOut</text>

  <rect x="628" y="134" width="260" height="48" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="644" y="155" fill="#1E40AF" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">204 No Content</text>
  <text x="644" y="172" fill="#1D4ED8" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">DELETE /books/{id} con cuerpo vacío</text>

  <rect x="628" y="196" width="260" height="48" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="644" y="217" fill="#92400E" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">404 Not Found</text>
  <text x="644" y="234" fill="#B45309" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">GET o DELETE sobre id ausente</text>

  <text x="32" y="286" fill="#64748B" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Verifica solo este paso con: uv run onramp inspect --paso 1 y uv run onramp check --paso 1</text>
</svg>
