<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p1-title p1-desc">
  <title id="p1-title">Paso 1: Contratos HTTP/1.1, validación Pydantic y estado aislado</title>
  <desc id="p1-desc">Flujo de peticiones HTTP hacia FastAPI pasando por la validación estricta de BookCreate (extra='forbid', título no vacío y Decimal) y el estado aislado por instancia, respondiendo 201 Created, 204 No Content, 404 Not Found o 422 Unprocessable Entity.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="940" height="340" rx="12" fill="#F8F7F4"/>
  <text x="32" y="38" fill="#0F172A" font-size="16" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Paso 1 — Contratos HTTP/1.1, validación Pydantic y estado aislado</text>

  <!-- Cliente -->
  <rect x="28" y="88" width="166" height="164" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="111" y="118" fill="#0F172A" font-size="13.5" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Cliente HTTP</text>
  <text x="111" y="148" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">POST /books</text>
  <text x="111" y="172" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GET /books/{id}</text>
  <text x="111" y="196" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">DELETE /books/{id}</text>
  <text x="111" y="226" fill="#64748B" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">JSON con title y price</text>

  <line x1="198" y1="170" x2="236" y2="170" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Pydantic + FastAPI -->
  <rect x="242" y="64" width="346" height="222" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="415" y="90" fill="#1D4ED8" font-size="13" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">FastAPI — create_app()</text>

  <rect x="258" y="102" width="314" height="82" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="272" y="122" fill="#0F172A" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1. BookCreate (Pydantic)</text>
  <text x="272" y="142" fill="#475569" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConfigDict(extra="forbid")</text>
  <text x="272" y="159" fill="#475569" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">title: min_length=1, max_length=120</text>
  <text x="272" y="176" fill="#475569" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">price: Decimal (gt=0, decimal_places=2)</text>

  <rect x="258" y="196" width="314" height="74" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="272" y="218" fill="#1E40AF" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2. Estado local aislado</text>
  <text x="272" y="238" fill="#1D4ED8" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">books = {} · next_id = 1 (por instancia)</text>
  <text x="272" y="256" fill="#1D4ED8" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Dos apps nunca comparten catálogo</text>

  <!-- Flechas hacia respuestas -->
  <line x1="592" y1="100" x2="650" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="592" y1="146" x2="650" y2="146" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="592" y1="196" x2="650" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <line x1="592" y1="246" x2="650" y2="258" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arrow-red)"/>

  <!-- Respuestas -->
  <rect x="656" y="66" width="256" height="46" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <text x="670" y="86" fill="#065F46" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">201 Created</text>
  <text x="670" y="102" fill="#047857" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">POST /books devuelve BookOut (Decimal)</text>

  <rect x="656" y="122" width="256" height="46" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="670" y="142" fill="#1E40AF" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">204 No Content</text>
  <text x="670" y="158" fill="#1D4ED8" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">DELETE /books/{id} con cuerpo vacío</text>

  <rect x="656" y="178" width="256" height="46" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="670" y="198" fill="#92400E" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">404 Not Found</text>
  <text x="670" y="214" fill="#B45309" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">GET o DELETE sobre id inexistente</text>

  <rect x="656" y="234" width="256" height="50" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="670" y="254" fill="#991B1B" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">422 Unprocessable Entity</text>
  <text x="670" y="271" fill="#B91C1C" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Campo extra, título vacío o precio &lt;= 0</text>

  <text x="32" y="316" fill="#64748B" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Verifica solo este paso con: uv run onramp inspect --paso 1 y uv run onramp check --paso 1</text>
</svg>
