<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pyd-title pyd-desc">
  <title id="pyd-title">Paso 2: Validación estricta con Pydantic y Decimal</title>
  <desc id="pyd-desc">Flujo de validación de JSON en BookCreate usando ConfigDict(extra='forbid'), Field para título no vacío y Decimal mayor que cero con dos decimales, respondiendo 201 Created o 422 Unprocessable Entity.</desc>
  <defs>
    <marker id="arrow-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrow-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="920" height="300" rx="12" fill="#F8F7F4"/>
  <text x="32" y="38" fill="#0F172A" font-size="16" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Paso 2 — Validación estricta con Pydantic y dinero exacto con Decimal</text>

  <!-- JSON de entrada -->
  <rect x="32" y="84" width="214" height="148" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="50" y="110" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">JSON del cliente</text>
  <text x="50" y="136" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{</text>
  <text x="62" y="156" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"title": "Clean Code",</text>
  <text x="62" y="176" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"price": "125.50"</text>
  <text x="50" y="196" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">}</text>

  <line x1="250" y1="158" x2="298" y2="158" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-p)"/>

  <!-- Reglas BookCreate -->
  <rect x="304" y="70" width="300" height="176" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="454" y="98" fill="#1D4ED8" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">BookCreate(BaseModel)</text>
  <rect x="320" y="112" width="268" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="332" y="133" fill="#0F172A" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">model_config = ConfigDict(extra="forbid")</text>
  <rect x="320" y="154" width="268" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="332" y="175" fill="#0F172A" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">title: Field(min_length=1, max_length=120)</text>
  <rect x="320" y="196" width="268" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="332" y="217" fill="#0F172A" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">price: Decimal = Field(gt=0, dec=2)</text>

  <!-- Salida OK -->
  <line x1="608" y1="122" x2="660" y2="108" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-p)"/>
  <rect x="666" y="76" width="222" height="68" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <text x="682" y="100" fill="#065F46" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">201 Created</text>
  <text x="682" y="120" fill="#047857" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">price entra como Decimal</text>
  <text x="682" y="136" fill="#047857" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">exacto en base 10</text>

  <!-- Salida 422 -->
  <line x1="608" y1="192" x2="660" y2="204" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-r)"/>
  <rect x="666" y="166" width="222" height="76" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="682" y="190" fill="#991B1B" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">422 Unprocessable</text>
  <text x="682" y="210" fill="#B91C1C" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Campo extra, título vacío,</text>
  <text x="682" y="226" fill="#B91C1C" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">precio &lt;= 0 o &gt;2 decimales</text>

  <text x="32" y="276" fill="#64748B" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Verifica solo este paso con: uv run onramp inspect --paso 2 y uv run onramp check --paso 2</text>
</svg>
