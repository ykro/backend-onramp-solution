<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lock-title lock-desc">
  <title id="lock-title">Paso 4: Condición de carrera vs exclusión mutua con threading.Lock</title>
  <desc id="lock-desc">Comparación entre cinco hilos sincronizados con Barrier(5) reservando la misma sala sin bloqueo, que genera múltiples reservas, frente a la sección crítica protegida por un candado que garantiza una sola reserva.</desc>
  <defs>
    <marker id="arrow-l" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrow-err" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="920" height="310" rx="12" fill="#F8F7F4"/>
  <text x="32" y="36" fill="#0F172A" font-size="16" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Paso 4 — Condición de carrera frente a exclusión mutua con threading.Lock</text>

  <!-- Fila 1: Sin Lock -->
  <rect x="32" y="56" width="856" height="106" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <text x="50" y="78" fill="#991B1B" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Sin Lock (condición de carrera)</text>

  <rect x="50" y="90" width="184" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="142" y="114" fill="#0F172A" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Barrier(5)</text>
  <text x="142" y="132" fill="#475569" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">5 hilos llegan a la vez</text>

  <line x1="238" y1="118" x2="292" y2="118" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-err)"/>

  <rect x="298" y="90" width="260" height="56" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="428" y="113" fill="#991B1B" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Todos leen sala libre antes de escribir</text>
  <text x="428" y="132" fill="#B91C1C" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">time.sleep() abre la ventana de carrera</text>

  <line x1="562" y1="118" x2="616" y2="118" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-err)"/>

  <rect x="622" y="90" width="246" height="56" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="745" y="113" fill="#991B1B" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">5 confirmaciones · stored == 5</text>
  <text x="745" y="132" fill="#B91C1C" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">La misma sala quedó reservada 5 veces</text>

  <!-- Fila 2: Con Lock -->
  <rect x="32" y="178" width="856" height="110" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="50" y="200" fill="#065F46" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Con un threading.Lock</text>

  <rect x="50" y="212" width="184" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="142" y="236" fill="#0F172A" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Barrier(5)</text>
  <text x="142" y="254" fill="#475569" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">5 hilos llegan a la vez</text>

  <line x1="238" y1="241" x2="292" y2="241" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-l)"/>

  <rect x="298" y="212" width="260" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="428" y="236" fill="#1E40AF" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Sección crítica con candado</text>
  <text x="428" y="255" fill="#1D4ED8" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Solo 1 hilo entra, verifica y guarda</text>

  <line x1="562" y1="241" x2="616" y2="241" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-l)"/>

  <rect x="622" y="212" width="246" height="58" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <text x="745" y="236" fill="#065F46" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">1 confirmación · stored == 1</text>
  <text x="745" y="255" fill="#047857" font-size="10.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">Los otros 4 hilos reciben False</text>
</svg>
