<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-title test-desc">
  <title id="test-title">Paso 5: Ciclo de pruebas automatizadas Arrange, Act, Assert</title>
  <desc id="test-desc">Flujo de una prueba automatizada en pytest con las etapas Arrange, Act y Assert, mostrando verde ante la calculate_late_fee correcta y rojo ante cada versión con un bug.</desc>
  <defs>
    <marker id="arrow-t" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrow-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="arrow-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="920" height="330" rx="12" fill="#F8F7F4"/>
  <text x="32" y="36" fill="#0F172A" font-size="16" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Paso 5 — Pruebas automatizadas desde cero (Arrange -&gt; Act -&gt; Assert)</text>

  <!-- Fila 1: Arrange -> Act -> Assert -->
  <rect x="32" y="60" width="256" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="48" y="74" width="76" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="86" y="88" fill="#1D4ED8" font-size="10.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ARRANGE</text>
  <text x="48" y="116" fill="#0F172A" font-size="12.5" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Prepara los datos</text>
  <text x="48" y="138" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">days_late = 4 · rate = 2.50</text>

  <line x1="292" y1="108" x2="326" y2="108" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-t)"/>

  <rect x="332" y="60" width="256" height="96" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="348" y="74" width="52" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="374" y="88" fill="#1D4ED8" font-size="10.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ACT</text>
  <text x="348" y="116" fill="#0F172A" font-size="12.5" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Ejecuta la función</text>
  <text x="348" y="138" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fee = calculate_late_fee(4)</text>

  <line x1="592" y1="108" x2="626" y2="108" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-t)"/>

  <rect x="632" y="60" width="256" height="96" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="648" y="74" width="72" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="684" y="88" fill="#1D4ED8" font-size="10.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ASSERT</text>
  <text x="648" y="116" fill="#0F172A" font-size="12.5" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Verifica el contrato</text>
  <text x="648" y="138" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">assert fee == Decimal("10.00")</text>

  <!-- Fila 2: Verde ante sana vs Rojo ante bug -->
  <line x1="460" y1="160" x2="250" y2="196" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-ok)"/>
  <line x1="460" y1="160" x2="670" y2="196" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-fail)"/>

  <rect x="32" y="202" width="414" height="86" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="50" y="228" fill="#065F46" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">VERDE ante la calculate_late_fee correcta</text>
  <text x="50" y="250" fill="#047857" font-size="11.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Todas tus pruebas pasan (código de salida 0):</text>
  <text x="50" y="270" fill="#047857" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Cada assert coincide con la regla de negocio</text>

  <rect x="474" y="202" width="414" height="86" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="492" y="228" fill="#991B1B" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ROJO ante cada versión con un bug</text>
  <text x="492" y="250" fill="#B91C1C" font-size="11.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Al sustituir la función por la versión A o la B, falla (código 1).</text>
  <text x="492" y="270" fill="#B91C1C" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Al menos un assert de tu suite detecta cada versión</text>

  <text x="32" y="312" fill="#64748B" font-size="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Verifica solo este paso con: uv run onramp inspect --paso 5 y uv run onramp check --paso 5</text>
</svg>
